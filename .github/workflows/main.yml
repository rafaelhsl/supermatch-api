name: Robô da Madrugada (Scraper)

on:
  # O Despertador: roda todo dia às 11:17 UTC (08:17 da manhã no Brasil).
  # Não pode ser de madrugada: o Apoio Entrega mostra todos os produtos como "Item indisponível" (sem preço)
  # antes das ~7h, e a carga ficaria sem os dados dele. O GitHub nunca roda antes do horário do cron
  # (só atrasa), então este horário garante que a carga começa depois das 8h. Evitamos o minuto 00 porque
  # é quando o GitHub mais atrasa as execuções agendadas.
  schedule:
    - cron: '17 11 * * *'
  # Isso permite que você clique num botão para rodar na hora que quiser testar!
  # Dispare depois das 8h da manhã (Brasília), pelo mesmo motivo acima.
  workflow_dispatch:
    inputs:
      mercados:
        description: 'Só estes mercados (separados por vírgula). Vazio = todos. Opções: Apoio Entrega, Atacadao, Supernosso, Super ABC'
        required: false
        default: ''
      gravar:
        description: 'Gravar no banco? Escolha "nao" para só testar (mostra o resumo e não altera nada)'
        type: choice
        options:
          - sim
          - nao
        default: sim
      coleta:
        description: 'Como coletar: "api" (padrão: API pública para Apoio, Atacadão e Supernosso e robô para o Super ABC, 100 produtos) ou "robos" (modo antigo, só robôs, 11 itens, tudo ou nada)'
        type: choice
        options:
          - api
          - robos
        default: api

jobs:
  atualizar_banco_de_dados:
    runs-on: ubuntu-latest # O GitHub liga um Linux para nós
    timeout-minutes: 150   # a carga com os 100 produtos leva 15 a 45 minutos (o Super ABC é o mais lento)

    steps:
    - name: Puxando o código do projeto
      uses: actions/checkout@v7

    - name: Configurando o Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Instalando as bibliotecas (requirements.txt)
      run: pip install -r requirements.txt

    - name: Instalando os navegadores fantasmas (Playwright)
      run: python -m playwright install --with-deps chromium

    - name: 🚀 Acordando os Robôs e Salvando no Supabase!
      env:
        # Injeta a chave secreta que salvamos no cofre do GitHub
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        # Só têm valor quando a execução é disparada à mão; na agendada ficam vazios (todos os mercados, gravando)
        SO_MERCADOS: ${{ github.event.inputs.mercados }}
        SEM_GRAVAR: ${{ github.event.inputs.gravar == 'nao' && '1' || '' }}
        # Na agendada o campo "coleta" é vazio: vale a coleta por API. "robos" volta ao modo antigo (COLETA_POR_API=0).
        COLETA_POR_API: ${{ github.event.inputs.coleta == 'robos' && '0' || '1' }}
      run: python alimentar_banco.py
