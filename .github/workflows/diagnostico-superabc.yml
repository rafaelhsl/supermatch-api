name: Diagnóstico Super ABC (temporário)

# Roda só na branch da correção e NÃO usa nenhum segredo: não acessa o Supabase.
# Remover junto com diagnostico_superabc.py depois de validar a correção.
on:
  push:
    branches: [corrige-super-abc]
    paths:
      - diagnostico_superabc.py
      - Scraper_SuperABC.py
      - .github/workflows/diagnostico-superabc.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
    - name: Puxando o código do projeto
      uses: actions/checkout@v4

    - name: Configurando o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalando o Playwright
      run: pip install playwright

    - name: Instalando o navegador
      run: python -m playwright install --with-deps chromium

    - name: Rodando o diagnóstico
      run: python diagnostico_superabc.py diagnostico_superabc

    - name: Guardando capturas de tela e HTML
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diagnostico-superabc
        path: |
          diagnostico_superabc/
          debug_*.png
        if-no-files-found: warn
