name: Diagnóstico do Apoio (temporário, sem banco)

# Roda só na branch apoio-diagnostico. Não usa nenhum segredo e não escreve nada no banco.
# Remover depois de descobrir por que o Apoio volta sem produtos nos servidores do GitHub.
on:
  push:
    branches: [apoio-diagnostico]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
    - name: Puxando o código do projeto
      uses: actions/checkout@v4

    - name: Configurando o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalando as bibliotecas (requirements.txt)
      run: pip install -r requirements.txt

    - name: Instalando os navegadores fantasmas (Playwright)
      run: python -m playwright install --with-deps chromium

    - name: Rodando o diagnóstico do Apoio
      run: python diagnostico_apoio.py

    - name: Guardando as capturas de tela das falhas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: capturas-apoio
        path: debug_*.png
        if-no-files-found: ignore
