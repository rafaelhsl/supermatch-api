name: Teste da carga dos robôs (temporário, sem banco)

# Roda só na branch da correção. Executa a carga completa com SEM_GRAVAR=1: não usa nenhum segredo
# e não escreve nada no banco. Remover antes do merge.
on:
  push:
    branches: [robos-confirmam-localizacao]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  carga_sem_gravar:
    runs-on: ubuntu-latest
    steps:
    - name: Puxando o código do projeto
      uses: actions/checkout@v4

    - name: Configurando o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalando as bibliotecas (requirements.txt)
      run: pip install -r requirements.txt

    - name: Instalando os navegadores fantasmas (Playwright)
      run: python -m playwright install --with-deps chromium

    - name: Rodando a carga completa SEM gravar no banco
      env:
        SEM_GRAVAR: "1"
      run: python alimentar_banco.py
